# git-multi-identity — identity map
#
# One line per identity. Pipe-delimited. Lines starting with # are ignored.
# Copy this file to identities.conf (same folder) and edit the CHANGE_ME values.
#
# Fields:
#   name          short id, used for filenames (~/.gitconfig-<name>) — no spaces/pipes
#   ssh_host_alias  the Host alias you'll use in ~/.ssh/config (pick anything unique)
#   real_host       the actual git server hostname
#   key_filename    filename for the ed25519 key, created under ~/.ssh/
#   git_name        name to attach to commits for this identity
#   git_email       email to attach to commits for this identity
#   path_glob       directory pattern (relative to $HOME) — repos cloned under here
#                   automatically get this identity's name/email via git includeIf
#
# name|ssh_host_alias|real_host|key_filename|git_name|git_email|path_glob
work|github-do|github.internal.digitalocean.com|id_ed25519_do_work|Jack Chan|jchan@digitalocean.com|~/work/**
personal-github|github-personal|github.com|id_ed25519_personal_gh|Jack Chan|CHANGE_ME@personal-email.com|~/personal/**
personal-gitlab|gitlab-personal|gitlab.com|id_ed25519_personal_gl|Jack Chan|CHANGE_ME@personal-email.com|~/personal/**
